
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DocScan - Free Online Document Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tailwind via CDN (for quick mockup only) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./assets/css/app.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" rel="stylesheet">
    
  </head>
  <body class="min-h-screen bg-gray-100 flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold text-gray-800">DocScan</h1>
          <p class="text-xs text-gray-500">
            Upload clean images and download scanned documents
          </p>
        </div>
        <nav>
          <button class="text-sm text-blue-600 hover:text-blue-800">
            History
          </button>
        </nav>
      </div>
    </header>

    <!-- Main content -->
    <main class="flex-1">
      <div class="max-w-5xl mx-auto px-4 py-8">
        <div class="bg-white shadow rounded-lg p-6">
          <h2 class="text-lg font-medium text-gray-800 mb-4">
            Scan a new document
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left column: Upload + options -->
            <section>
              <!-- Upload area -->
              <div class="border-2 border-dashed rounded-lg p-4 text-center cursor-pointer hover:border-blue-400 transition border-gray-300 bg-gray-50">
                <div class="flex flex-col items-center">
                  <div class="h-12 w-12 rounded-full bg-blue-100 flex items-center justify-center mb-2">
                    <span class="text-blue-500 text-2xl">📄</span>
                  </div>
                  <p class="text-sm text-gray-700">
                    Drop an image here or
                    <span class="text-blue-600" id="btnBrowse">click to upload</span>
                  </p>
                  <p class="text-xs text-gray-400 mt-1">
                    Supported: JPG, PNG (PDF export after scan)
                  </p>
                  <input type="file" id="imageInput" accept="image/*" hidden>
                  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
                  <!-- <div id="dropZone" class="upload-zone">
                      <i class="bi bi-cloud-arrow-up upload-icon"></i>
                      <h5 class="mt-3">Drop your document here</h5>
                      <p class="text-muted">
                          Drag & Drop image here or choose an option below
                      </p>
                      <div class="mt-3">
                          <button class="btn btn-primary" id="btnBrowse">
                              <i class="bi bi-folder2-open"></i>
                              Browse File
                          </button>
                          <button class="btn btn-outline-primary" id="btnCamera">
                              <i class="bi bi-camera"></i>
                              Camera
                          </button>
                      </div>
                      <input type="file" id="imageInput" accept="image/*" hidden>
                      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
                    </div> -->
                </div>
              </div>

              <!-- Selected file info (placeholder) -->
              <div class="mt-3 text-xs text-gray-600">
                <p class="italic text-gray-400">
                  Selected file details will appear here.
                </p>
              </div>

              <!-- Options -->
              <div class="mt-4">
                <label class="block text-xs font-medium text-gray-700 mb-1">
                  Mode
                </label>
                <select
                  class="w-full border rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"
                >
                  <option>Standard</option>
                  <option>High contrast</option>
                </select>
              </div>

              <div class="mt-3 flex items-center">
                <input
                  id="generatePdf"
                  type="checkbox"
                  checked
                  class="h-4 w-4 text-blue-600 border-gray-300 rounded"
                />
                <label for="generatePdf" class="ml-2 text-xs text-gray-700">
                  Also generate PDF
                </label>
                </div>

              <!-- Scan button -->
              <div class="mt-5">
                <button class="inline-flex items-center px-4 py-2 rounded text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                  Scan Document
                </button>
              </div>
            </section>

            <!-- Right column: Preview -->
            <section class="border border-gray-200 rounded-lg p-3 bg-gray-50">
              <div class="flex justify-between items-center mb-2">
                <h3 class="text-sm font-medium text-gray-700">Preview</h3>
                <div class="flex text-xs">
                  <button
                    class="px-2 py-1 rounded-l border text-xs bg-white border-blue-500 text-blue-600"
                  >
                    Original
                  </button>
                  <button
                    class="px-2 py-1 rounded-r border text-xs bg-gray-100 border-gray-300 text-gray-500"
                  >
                    Scanned
                  </button>
                </div>
              </div>

              <!-- Preview box -->
              <div
                class="h-64 flex items-center justify-center text-xs text-gray-400 border border-dashed border-gray-300 rounded bg-white"
              >
                Preview will appear here after scanning.
              </div>

              <!-- Download buttons (placeholder) -->
              <div class="mt-3 flex flex-wrap gap-2">
                <button
                  class="px-3 py-1 rounded text-xs font-medium text-white bg-green-600 hover:bg-green-700"
                >
                  Download Image
                </button>
                <button
                  class="px-3 py-1 rounded text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700"
                >
                  Download PDF
                </button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </body>

  <!-- Crop Modal -->
  <div id="cropModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
      <div class="relative w-full max-w-5xl mx-4 bg-white rounded-xl shadow-xl">
          <div class="flex items-center justify-between px-6 py-4 border-b">
              <h2 class="text-lg font-semibold">Crop Image</h2>
              <button id="btnCloseCrop" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">
                  &times;
              </button>
          </div>
          <!-- Body -->
          <div class="p-6 flex justify-center bg-gray-50">
              <img id="cropImage" class="max-w-full max-h-[70vh] object-contain">
          </div>
          <!-- Footer -->
          <div class="flex justify-end gap-3 px-6 py-4 border-t">
              <button id="btnCancelCrop" class="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-100">
                  Cancel
              </button>
              <button id="btnCrop" class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
                  Crop Image
              </button>
          </div>
      </div>
  </div>

  <div class="modal fade" id="previewModal">
    <div class="modal-dialog modal-dialog-centered" style="max-width:900px;">
      <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Preview Document</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body d-flex justify-content-center align-items-center bg-light">
          <!-- <img id="previewImage" class="preview-image"> -->
              <div id="canvasContainer">
                  <canvas id="previewModalCanvas"></canvas>
              </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
  <script src="./assets/js/app.js"></script>

</html>
